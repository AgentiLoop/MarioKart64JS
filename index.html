<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TarioKart 64</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Trebuchet MS", system-ui, sans-serif; }
  canvas#game { display: block; width: 100%; height: 100%; }

  /* ---------- native 320x240 menu screen, scaled uniformly to fit (4:3 letterbox like the N64 frame) ---------- */
  #screen { position: fixed; left: 50%; top: 50%; width: 320px; height: 240px; transform: translate(-50%, -50%) scale(3); transform-origin: center; z-index: 5; display: none; background: #000; }
  #screen img, #screen canvas { image-rendering: pixelated; }
  #screen .scr { position: absolute; inset: 0; display: none; overflow: hidden; }
  #screen .scr img { position: absolute; display: block; }
  #screen .bg { left: 0; top: 0; width: 320px; height: 240px; }
  #hint { position: fixed; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 13px; color: #fff; opacity: .75; font-weight: 700; text-shadow: 0 1px 0 #000, 0 0 4px #000; z-index: 6; display: none; pointer-events: none; }

  /* ---------- title: START_MENU items at their ROM positions (menu_items.c / textures.c dX,dY) ---------- */
  #titleLogo { left: 32px; top: 7px; width: 256px; height: 128px; }      /* render_game_logo centred at (160,71) */
  #copyright { left: 98px; top: 199px; width: 124px; height: 17px; }
  #pushStart { left: 81px; top: 179px; width: 159px; height: 16px; }

  /* ---------- course select (not yet native; HTML grid inside the 320x240 frame) ---------- */
  #menu { flex-direction: column; align-items: center; }
  #menu.scr { display: none; }
  #menu .inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 4px; width: 100%; height: 100%; box-sizing: border-box; overflow-y: auto; }
  #menu h1 { margin: 0; font-size: 18px; font-style: italic; font-family: "Arial Black", system-ui, sans-serif; color: #ffd23a; -webkit-text-stroke: 1.5px #b3200f; paint-order: stroke fill; text-shadow: 0 2px 0 #000; }
  #menuList { display: grid; grid-template-columns: repeat(2, 150px); gap: 3px; }
  #menu button { display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 4px; padding: 0 3px; height: 22px; font: inherit; text-align: left; color: #fff; background: rgba(0,0,40,.8); border: 1px solid #fff; box-shadow: 0 0 0 1px #e0301e; border-radius: 3px; cursor: pointer; }
  #menu button img { position: static; width: 32px; height: 20px; background: #000; }
  #menu button:hover, #menu button:focus { outline: none; background: #2438b0; }
  #menu button b { display: block; font-size: 7px; line-height: 1; }
  #menu button br, #menu button span span { display: none; }

  /* ---------- character select: CHARACTER_SELECT_MENU at ROM positions (D_800E7108, D_02004B4C, D_02004B74) ---------- */
  #charBanner { left: 51px; top: 16px; width: 220px; height: 32px; }
  .char { position: absolute; width: 64px; height: 76px; background: none; border: none; padding: 0; margin: 0; cursor: pointer; }
  .char .holder { position: absolute; left: 0; top: 0; width: 64px; height: 64px; overflow: hidden; }
  .char .face { left: 0; width: 64px; height: 1088px; }           /* 17 stacked 64x64 frames */
  .char .name { left: 0; top: 64px; width: 64px; height: 12px; }
  .char .border { left: 0; top: 0; width: 64px; height: 64px; display: none; pointer-events: none; }
  .char.cursor .border { display: block; }
  #charOk { position: absolute; left: 264px; top: 202px; width: 31px; height: 19px; background: none; border: none; padding: 0; margin: 0; cursor: pointer; }
  #charOk .box { position: absolute; left: 0; top: 0; width: 30px; height: 18px; background: rgb(1,1,1); }   /* func_800A8564 box */
  #charOk img { left: 0; top: 0; width: 31px; height: 19px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; font-weight: 900; font-family: "Arial Black", "Trebuchet MS", system-ui, sans-serif; text-shadow: 3px 0 #000, -3px 0 #000, 0 3px #000, 0 -3px #000, 2px 2px #000, -2px -2px #000, 2px -2px #000, -2px 2px #000; display: none; }
  /* place: outline drawn on a separate layer underneath the fill so the "th" stroke never crosses the number */
  #pos, #posStroke { position: absolute; left: 24px; bottom: 20px; font-size: 128px; font-style: italic; line-height: 1; text-shadow: none; }
  #posStroke { color: #1a1a6e; -webkit-text-stroke: 5px #1a1a6e; filter: drop-shadow(0 4px 0 #000); }
  #pos { color: #ffe033; background: linear-gradient(#fff36b, #ff9d00); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #pos small, #posStroke small { font-size: 44px; }
  #lap { position: absolute; right: 24px; top: 16px; font-size: 34px; text-align: right; color: #ffe033; }
  #time { font-size: 24px; color: #fff; font-family: "Courier New", monospace; letter-spacing: 1px; }
  #speed { position: absolute; right: 24px; bottom: 20px; font-size: 56px; font-style: italic; color: #7dff6a; }
  #speed small { font-size: 22px; color: #fff; }
  #banner { position: absolute; left: 0; right: 0; top: 28%; text-align: center; font-size: 150px; font-style: italic; color: #ffd23a; -webkit-text-stroke: 6px #b3200f; paint-order: stroke fill; text-shadow: 0 8px 0 #000; }
  #mini { position: absolute; left: 20px; top: 20px; width: 170px; height: 170px; background: rgba(0,0,40,.45); border-radius: 12px; border: 4px solid #fff; box-shadow: 0 0 0 3px #1a1a6e, 0 4px 0 3px #000; }
  #item { position: absolute; left: 218px; top: 20px; min-width: 150px; padding: 14px 18px; font-size: 26px; background: linear-gradient(#3b4fd8, #1a1a6e); border-radius: 14px; border: 4px solid #fff; box-shadow: 0 0 0 3px #e0301e, 0 4px 0 3px #000; text-align: center; }
  #help { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 13px; opacity: .7; font-weight: 700; font-family: "Trebuchet MS", system-ui, sans-serif; text-shadow: 0 1px 0 #000, 0 0 4px #000; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 320x240 native menu frame: title / course select / character select, all at ROM pixel positions -->
<div id="screen">
  <!-- START_MENU: blue-sky background, logo, copyright, flashing PUSH START -->
  <div id="title" class="scr">
    <img id="titleBg" class="bg" alt="" src="/mk64/menu/background_blue_sky.png" />
    <img id="titleLogo" alt="TarioKart 64" src="/mk64/menu/logo_mario_kart_64.png" />
    <img id="copyright" alt="" src="/mk64/menu/copyright_1996.png" />
    <img id="pushStart" alt="" src="/mk64/menu/push_start_button.png" />
  </div>

  <!-- course select: MK64 course preview thumbnails from the ROM (tinted COURSE_SELECT_BACKGROUND) -->
  <div id="menu" class="scr">
    <img id="menuBg" class="bg" alt="" src="/mk64/menu/background_course_select.png" />
    <div class="inner">
      <h1>SELECT COURSE</h1>
      <div id="menuList"></div>
    </div>
  </div>

  <!-- CHARACTER_SELECT_MENU: tinted background, PLAYER SELECT banner, 8 portraits + names, P1 border cursor, OK -->
  <div id="char" class="scr">
    <img id="charBg" class="bg" alt="" src="/mk64/menu/background_player_select.png" />
    <img id="charBanner" alt="" src="/mk64/charselect/player_select_banner.png" />
    <div id="charGrid"></div>
    <button id="charOk" aria-label="OK"><div class="box"></div><img alt="" src="/mk64/charselect/ok.png" /></button>
  </div>
</div>
<div id="hint"></div>

<div id="hud">
  <canvas id="mini" width="340" height="340"></canvas>
  <div id="lap"><div id="lapText">LAP 1/3</div><div id="time">0:00.00</div></div>
  <div id="item">NO ITEM</div>
  <div id="posStroke">1<small>st</small></div>
  <div id="pos">1<small>st</small></div>
  <div id="speed">0<small> km/h</small></div>
  <div id="banner"></div>
  <div id="help">↑/W gas · ↓/S brake · ←→/AD steer · Space drift (release for mini-turbo) · Shift/E use item · R restart · Gamepad: A gas, B brake, LB/RB drift, X item, Start restart · M course menu · N music on/off · G retro/HD</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
